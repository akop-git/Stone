name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Pillow for icon generation
        run: python3 -m pip install --quiet pillow

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install persistent debug keystore
        # Copy the debug keystore committed to the repo into the location gradle
        # expects. This means every CI build signs the APK with the SAME key, so
        # the user can update the installed app without uninstalling first (which
        # would wipe their data). Without this step, gradle generates a fresh
        # throwaway keystore every run and every install becomes a forced uninstall.
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          echo "keystore installed:"
          ls -la ~/.android/debug.keystore

      - name: Generate Android app icons
        # Generate icons directly with Pillow, bypassing @capacitor/assets which
        # was silently producing nothing. This writes ic_launcher.png, _round, and
        # _foreground into every mipmap density folder. Fail loud if source is bad.
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os, sys

          src = 'assets/icon-only.png'
          if not os.path.exists(src):
              print(f"ERROR: {src} not found in repo. Icon generation skipped.")
              sys.exit(1)

          img = Image.open(src).convert('RGBA')
          print(f"Source: {img.size} {img.mode}")

          sizes = {
              'mipmap-mdpi':    48,
              'mipmap-hdpi':    72,
              'mipmap-xhdpi':   96,
              'mipmap-xxhdpi':  144,
              'mipmap-xxxhdpi': 192,
          }
          res_dir = 'android/app/src/main/res'
          if not os.path.isdir(res_dir):
              print(f"ERROR: {res_dir} does not exist - cap sync may have failed")
              sys.exit(1)

          for folder, size in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  resized.save(os.path.join(target_dir, name), 'PNG', optimize=True)
              print(f"  {folder}: {size}x{size} -> ic_launcher.png, _round, _foreground")

          print("Icon generation complete.")
          PYEOF
          echo "--- generated mipmap files ---"
          find android/app/src/main/res/mipmap-* -name "ic_launcher*.png" -exec ls -la {} \;

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stone-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
